name: Fork release

# A fork cannot publish under the @aphexcms names on npm, so a tag builds
# cms-core and visual-editing and attaches their packed tarballs to a GitHub
# Release. An app depends on the asset URL, e.g.
#   https://github.com/<owner>/aphex/releases/download/<tag>/aphexcms-cms-core-<version>.tgz
on:
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: write

jobs:
  release:
    name: Pack & attach
    if: github.repository != 'IcelandicIcecream/aphex'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@aphexcms/cms-core --filter=@aphexcms/visual-editing

      - name: Test cms-core
        run: pnpm -F @aphexcms/cms-core test

      # Each package's prepack points its exports at dist.
      - name: Pack
        run: |
          mkdir -p release
          pnpm -F @aphexcms/cms-core -F @aphexcms/visual-editing exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/release"
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
